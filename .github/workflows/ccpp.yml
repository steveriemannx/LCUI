name: C/C++ CI
on:
  push:
    branches:
      - develop
      - master
      - main
    tags:
      - 'v*'
  pull_request:
jobs:
  format:
    name: Check C/C++ formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting of changed files
        run: npm run format:check -- origin/${{ github.base_ref || 'develop' }}

  build:
    needs: format
    env:
      TARGET_MAJOR: 3
      TARGET_VERSION: 3.0.0
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    name: "Builds binaries on ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/run-vcpkg@v11
        if: runner.os == 'Windows'
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Install tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install debhelper lcov valgrind xvfb -yy
          sudo apt-get install libfreetype6-dev libpng-dev libyaml-dev libomp-dev libx11-dev ninja-build fontconfig libfontconfig1-dev libjpeg-dev libxml2-dev libcairo2-dev

      - name: Configure
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release -DLCUI_BUILD_TESTS=ON -DLCUI_CI_ENV=ON

      - name: Configure for coverage mode
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLCUI_BUILD_TESTS=ON
          -DLCUI_ENABLE_COVERAGE=ON -DLCUI_ENABLE_MEMCHECK=ON -DLCUI_CI_ENV=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run all tests
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run all tests with memcheck
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Upload reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Install doc-viewer dependencies
        working-directory: examples/doc-viewer
        run: bun install

      - name: Install lcui-cli
        run: npm install -g @lcui/cli

      - name: Generate doc-viewer sources
        working-directory: examples/doc-viewer
        run: bun run compile

      - name: Process doc-viewer TSX files
        working-directory: examples/doc-viewer
        run: lcui build

      - name: Configure release and examples
        run: >-
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          -DLCUI_BUILD_TESTS=OFF -DLCUI_BUILD_EXAMPLES=ON
          -DLCUI_BUILD_DOC_VIEWER=ON -DLCUI_CI_ENV=ON

      - name: Build release and examples
        run: cmake --build build-release --config Release --parallel

      - name: Package and install libraries
        run: |
          cmake --build build-release --target package --config Release
          cmake --install build-release --prefix dist/lcui-package --config Release

      - name: Build examples
        run: cmake --build build-release --target lcui-examples --config Release --parallel

      - name: Install examples
        run: cmake --install build-release --prefix dist/lcui-examples --config Release --component Examples

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-static (${{ runner.os }})
          path: |
            dist/lcui-package

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-examples (${{ runner.os }})
          path: |
            dist/lcui-examples

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    env:
      ARTIFACT_DIR: ./release

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.ARTIFACT_DIR }}

      - name: Set release version
        run: python ./.github/scripts/get_release_version.py

      - name: Create release notes
        run: python ./.github/scripts/get_release_notes.py

      - name: Read package.json
        id: release_notes
        uses: juliangruber/read-file-action@v1
        with:
          path: RELEASE_NOTES.md
          trim: false

      - name: Create release
        uses: svenstaro/upload-release-action@v2
        with:
          body: ${{ steps.release_notes.outputs.content }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: LCUI ${{ env.REL_VERSION }}
          tag: ${{ github.ref }}
          file: ${{ env.ARTIFACT_DIR }}/*
          overwrite: true
          file_glob: true
